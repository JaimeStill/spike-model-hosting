# The quality suites evaluate runs from the laptop (package evaluation/gate): MTEB's tasks for the
# embedding role, through mteb_quality.py's encoder, and Inspect's for the generative roles:
# asr_quality.py's ASR sets for the audio role, vision_quality.py's tiers (inspect_evals' stock
# V*Bench, DocVQA and MMMU tasks) for the vision role, and agent_quality.py's tiers (inspect_evals'
# stock BFCL task) for the agent role, the last two sharing pass_stop.py's early stop; and the deep
# stage's tau2_quality.py (inspect_evals' stock τ2 airline and retail), whose simulated user is
# claude_code.py's Inspect provider, Claude Code in print mode. Its tests, test_*.py, prove the
# provider against a fake claude and the tiers' early stops (go test runs them, through
# suites_test.go). Each package is pinned exactly, and Python is the consumers mise environment's 3.14.8; uv.lock is committed,
# and `mise run currency` reports a pin behind its newest release. The quality stage reads the
# MTEB, Inspect AI and inspect_evals pins from this file (package evaluation/suites), the one place
# they are set. asr_quality.py imports huggingface-hub, pyarrow, kaldialign, regex (for the
# vendored asr_normalizer), soundfile and openai (Inspect's openai-api provider), and
# vision_quality.py's peak reads image sizes with pillow, so each is pinned here too; none needs
# torch. BFCL's multi-turn backends, which inspect_evals downloads, import
# mpmath (inspect_evals' bfcl extra), which the lock holds at 1.3.0 through sympy (<1.4); pinning
# it here would hold a package behind its newest for currency to report. The .venv uv syncs here
# is untracked.
#
# Held while set A's bars stand, the pins they were measured on: inspect-ai (the framework every
# Inspect bar ran on), inspect-evals, mteb, openai, and pillow (13 is a new major). Currency
# reports each behind its newest, and bumping one rebaselines the roles it affects.
[project]
name = "spike-suites"
version = "0.0.0"
requires-python = "==3.14.8"
dependencies = [
  "huggingface-hub==2.2.0",
  "inspect-ai==0.3.281",
  "inspect-evals==0.24.0",
  "kaldialign==0.12.0",
  "mteb==2.26.4",
  "openai==3.31.0",
  "pillow==12.3.0",
  "pyarrow==26.0.0",
  "regex==2026.9.29",
  "soundfile==0.14.0",
]

[tool.uv]
package = false
