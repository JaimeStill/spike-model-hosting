# The quality suites evaluate runs from the laptop (package evaluation/gate): MTEB's tasks for the
# embedding role, through mteb_quality.py's encoder, and Inspect's for the generative roles, so
# far asr_quality.py's ASR sets for the audio role. Each package is pinned exactly, and Python is
# the consumers mise environment's 3.14.8; uv.lock is committed, and `mise run currency` reports
# a pin behind its newest release. The quality stage reads the MTEB and Inspect AI pins from
# this file (package evaluation/suites), the one place they are set. asr_quality.py imports
# huggingface-hub, pyarrow, kaldialign, regex (for the vendored asr_normalizer), soundfile and
# openai (Inspect's openai-api provider), so each is pinned here too; none needs torch. The .venv
# uv syncs here is untracked.
[project]
name = "spike-suites"
version = "0.0.0"
requires-python = "==3.14.8"
dependencies = [
  "huggingface-hub==2.2.0",
  "inspect-ai==0.3.281",
  "inspect-evals==0.24.0",
  "kaldialign==0.12.0",
  "mteb==2.26.4",
  "openai==3.31.0",
  "pyarrow==26.0.0",
  "regex==2026.9.29",
  "soundfile==0.14.0",
]

[tool.uv]
package = false
