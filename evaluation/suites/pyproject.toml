# The quality suites evaluate runs from the laptop (package evaluation/gate): MTEB's tasks for the
# embedding role, through mteb_quality.py's encoder, and, in later work, Inspect's for the
# generative roles. Each package is pinned exactly, and Python is the consumers mise
# environment's 3.14.8; uv.lock is committed, and `mise run currency` reports a pin behind its
# newest release. The .venv uv syncs here is untracked.
[project]
name = "spike-suites"
version = "0.0.0"
requires-python = "==3.14.8"
dependencies = [
  "inspect-ai==0.3.281",
  "inspect-evals==0.24.0",
  "mteb==2.26.3",
]

[tool.uv]
package = false
