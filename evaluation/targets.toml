# The per-session targets evaluate's sweep sizes a model's context by (package evaluation/gate,
# Targets): per role, the largest request its committed tier lists send, its prompt (in) and the
# room its answer is given (out), in tokens. A sweep step's c is N times the largest target of the
# swept model's roles, capped at the card's context; a step the cap leaves a session short of its
# target fails on context. out is the answer's max_tokens, the room the request asks for, not an
# answer's measured length: a session needs that room to answer at all.
#
# Measured on b11734, 2026-10-19, on set A's model for each role, by the router's own count of
# each request's prompt (timings.prompt_n, usage.prompt_tokens). A vision or audio request's
# tokens are its model's: a model with another image or audio encoder counts the same request
# differently, so a candidate's sweep reads these as set A's measure until its own are taken.

[agent]
# The agentic shape an agent session is counted by, as capacity's agent streams and the deep
# stage's agentic grid cell send it: an 8192-token passage with the nonce and the summary ask
# after it, 512 out. Sent once to gpt-oss-120b on b11734, 2026-10-20, through capacity's own
# request (agenticBody): prompt_n 8294, the passage, the chat template and the ask. The nominal
# 8192 it replaces left no room for the template: at 2 slots and c = 17408 both streams ran out
# of context (docs/findings/slots.md).
in = 8294
out = 512
source = "capacity's agentic request on gpt-oss-120b, b11734 (8192-token passage, the chat template and the ask: prompt_n 8294), and its max_tokens, 512"

[vision]
# Every sample of the three vision tier lists (vision-vstar, vision-docvqa, vision-mmmu, 450
# questions) sent once through vision_quality.py's own eval at max_tokens 1 to Gemma 4 26B-A4B:
# the largest prompt is MMMU validation_Geography_16, 1076 tokens (the next, Psychology_11, 862).
# out is the tiers' max_tokens, 4096: at 1024, 32 of MMMU's 200 answers ran out.
in = 1076
out = 4096
source = "the vision tier lists' largest prompt on gemma-4-26B-A4B (MMMU validation_Geography_16, 1076 tokens), and the tiers' max_tokens, 4096"

