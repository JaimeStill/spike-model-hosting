[models.sampling]
source = "https://huggingface.co/google/gemma-4-E4B-it"
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
reason = "The card's recommended sampling."

[models.prompts]
source = "https://huggingface.co/google/gemma-4-E4B-it"
asr = "Transcribe the following speech segment in English into English text."
reason = "The card's ASR prompt, without its formatting bullets."

[[models]]
id = "ggml-org/embeddinggemma-2-GGUF:Q8_0"
publisher = "Google"
origin = "United States"
licence = "Apache-2.0"
roles = ["embedding"]
card_url = "https://huggingface.co/google/embeddinggemma-2"
card_context = 8192
active_params_b = 0.271
bits_per_weight = 8.68
kind = "embedding"
dims = 768
c = 8192
c_reason = "The context window its card states."
slots = 4
slots_reason = "The evaluation baseline's value."
args_reason = "An embedding model, mean pooled, its encoders kept out, one batch an input."

[models.args]
embeddings = true
pooling = "mean"
no-mmproj = true
b = 8192
ub = 8192

[models.prompts]
source = "https://huggingface.co/google/embeddinggemma-2"
reason = "The prompts of the model's sentence-transformers configuration that MTEB resolves."

[models.prompts.embedding]
Classification = "task: classification | query: "
Retrieval = "task: search result | query: "
