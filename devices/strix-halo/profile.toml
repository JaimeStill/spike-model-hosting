# The Strix Halo profile: set A, the startup set, four models loaded side by side and sized
# together against the 96GiB GTT pool of a ~90-96GB unified-memory host. Their settings are
# personal-agents' 96GiB preset (profiles/unified-96gb.ini) and the recipes it copies
# (reference/model-tiers.md, "~90-96GB (unified memory)"). Each model's reasons say why it takes
# its values. docs/pool.md and docs/findings (memory-budget.md, tool-reliability.md) record the
# main-model candidates.
#
# Each model runs its official embedded chat template at its card's sampling and sets no
# reasoning effort (the template's default). A shape a client must get, such as a mandatory tool
# call, is the client's to constrain per request (tool_choice, response_format), not the
# profile's.
host_class = "strix-halo"
bind = "tailnet"
# One KV pool for each model, its slots sharing it; each model sets its own slots.
kv = "unified"
# Strix Halo's memory bandwidth: 256-bit LPDDR5X-8000, 256 GB/s. evaluate compares each decode
# speed with the ceiling it sets (bandwidth over the bytes a token reads); nothing gates on it.
memory_bandwidth_gb_s = 256

# min_build is a floor, not a pin: a host runs any build at or above it, and each measurement
# names the build it ran on (memory_budget.build, and /props build_info). b11452 is the first
# build that runs EmbeddingGemma 2, the newest of set A's models, so it is the oldest build set A
# can serve on.
[engine]
name = "llama.cpp"
backend = "vulkan"
min_build = "b11452"

# c = 32768 is the default for a model without its own section, one pulled ad hoc; every set-A
# model sets its own c. checkpoint_min_step = 4096, down from llama.cpp's 8192, makes the
# 32-checkpoint budget's reach (32 x 4096 = 131072) match gpt-oss-120b's c exactly, while a
# stable prefix shorter than 8192 tokens still gets a checkpoint past it.
[defaults]
c = 32768
gpu_layers = 999
checkpoint_min_step = 4096

# Set A loads when the router starts: the harness model, a vision model, an audio model and
# the embedding model, four, the router's default --models-max.
[[sets]]
name = "a"
startup = true
models = [
  "ggml-org/gpt-oss-120b-GGUF:MXFP4",
  "ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0",
  "ggml-org/gemma-4-E4B-it-GGUF:Q8_0",
  "ggml-org/embeddinggemma-2-GGUF:Q8_0",
]

# The model each role's requests go to, for the probe and every instrument. Roles alone can't
# pick them: three of set A's models declare chat and two declare vision. gpt-oss-120b is the
# harness model, Gemma 4 26B-A4B takes the images and gemma-4-E4B the audio.
[sets.roles]
chat = "ggml-org/gpt-oss-120b-GGUF:MXFP4"
vision = "ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0"
audio = "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"
embedding = "ggml-org/embeddinggemma-2-GGUF:Q8_0"

# The binding test: with all four loaded and four requests in flight on each, at least the pool
# floor, 2816MiB (2.75GiB, evaluation/floors.toml), stays free.
[sets.memory_budget]
pool_mib = 98304
measured_mib = 94926
build = "b11565"
source = "docs/findings/memory-budget.md"

[[models]]
id = "ggml-org/gpt-oss-120b-GGUF:MXFP4"
publisher = "OpenAI"
origin = "United States"
# Licence: the card's license metadata (apache-2.0) and the LICENSE file in
# https://huggingface.co/openai/gpt-oss-120b.
licence = "Apache-2.0"
roles = ["chat"]
card_url = "https://huggingface.co/openai/gpt-oss-120b"
# card_context: config.json's max_position_embeddings; the card states none. Active parameters:
# the card's "117B parameters with 5.1B active". Bits per weight: the GGUF's 63374323968 bytes
# over its 116829156672 parameters (the router's /v1/models meta), 4.34.
card_context = 131072
active_params_b = 5.1
bits_per_weight = 4.34
kind = "generative"
c = 131072
c_reason = """
The harness model. Its trained context_length, 131072, is the ceiling c may reach: its KV cache
costs 36,864 bytes/token (18 of 36 layers hold a full-attention cache; the rest are 128-token
sliding windows), 4.5GiB at c = 131072, beside ~59GiB of MXFP4 weights.

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose c = 17664 at 2 slots; its result is
recorded in docs/findings/slots.md. The startup set keeps its pre-sweep c = 131072 until the
per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
"""
slots = 4
slots_reason = """
Each slot is one agent session at once. The slots share the model's one KV pool of c tokens
([*]'s kv-unified), so c grows with them.

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 2 slots, bound by the knee; its result
is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots until the
per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
"""

[models.sampling]
source = "https://github.com/openai/gpt-oss"
temperature = 1.0
top_p = 1.0
top_k = 0
min_p = 0.0
reason = """
Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters": temperature 1.0,
top_p 1.0. This GGUF carries no general.sampling.* keys, so without these the server serves its
own defaults (temp 0.8, top-k 40, top-p 0.95, min-p 0.05 on b11529). top-k = 0 and min-p = 0
turn off the two truncations the card doesn't name.
"""

[[models]]
id = "ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0"
publisher = "Google"
origin = "United States"
# Licence: the card's license metadata (apache-2.0), linking Google's Gemma 4 licence page,
# https://ai.google.dev/gemma/docs/gemma_4_license.
licence = "Apache-2.0"
# Vision through its mmproj, which the router loads beside the weights.
roles = ["chat", "vision"]
card_url = "https://huggingface.co/google/gemma-4-26B-A4B-it"
# card_context: the card's 256K. Active parameters: the card's MoE table, 3.8B active of 25.2B.
# Bits per weight: the GGUF's 14602321016 bytes over its 25233142046 parameters, 4.63.
card_context = 262144
active_params_b = 3.8
bits_per_weight = 4.63
kind = "generative"
c = 32768
c_reason = """
The vision model; the router loads its Q8_0 mmproj alongside. 5 of its 30 layers hold a
full-attention cache (20,480 bytes/token, 0.625GiB at c = 32768); the rest are 1024-token sliding
windows. The shared budget binds here, not its trained 262144: at c = 65536 and 4 slots, all four
loaded with four requests in flight on each left 2.61GiB of the pool free, under the 2.75GiB pool
floor (docs/findings/memory-budget.md).

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose c = 41472 at 8 slots; its result is
recorded in docs/findings/slots.md. The startup set keeps its pre-sweep c = 32768 until the
per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
"""
slots = 4
slots_reason = """
Each slot is one image request at once. The slots share the model's one KV pool of c tokens
([*]'s kv-unified), so c grows with them.

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 8 slots, bound by the image floor; its
result is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots until the
per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
"""
# The flag is --mtmd-batch-max-tokens in common/arg.cpp from b11452 (the minimum build) through
# b11734; its default is 1024.
mtmd_batch_max_tokens = 512
mtmd_batch_max_tokens_reason = """
mtmd-batch-max-tokens = 512 encodes each image in a batch of its own: the server caps an image
at 512 tokens (its ubatch), and by default batches consecutive images of the same patch grid up
to 1024. The image encoder's compute buffer, reserved at load for a 256-token warm-up image,
grows to the largest batch it has run and never shrinks: one 512-token image adds ~200MiB, a
two-image batch ~330MiB more. The cap takes the two-image step off, so the model's worst case
stays at the single-image level, at a measured cost within 1% on a two-image prompt's prefill
(docs/findings/memory-budget.md, "Gemma 4 26B-A4B's growth under vision use").
"""

[models.sampling]
source = "https://huggingface.co/google/gemma-4-26B-A4B-it"
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
reason = """
Sampling from the google/gemma-4-26B-A4B-it model card, "1. Sampling Parameters": temperature
1.0, top_p 0.95, top_k 64. b11529 already applies the GGUF's general.sampling.* keys, which carry
the same three values; the preset states them so the card, not the conversion, is the source,
and sets min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
"""

[[models]]
id = "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"
publisher = "Google"
origin = "United States"
# Licence: the card's license metadata (apache-2.0), linking Google's Gemma 4 licence page,
# https://ai.google.dev/gemma/docs/gemma_4_license.
licence = "Apache-2.0"
# Audio and vision through its mmproj: mmproj-gemma-4-E4B-it-Q8_0.gguf sets both
# clip.has_audio_encoder and clip.has_vision_encoder. Set A sends it audio; its images go to
# Gemma 4 26B-A4B.
roles = ["chat", "vision", "audio"]
card_url = "https://huggingface.co/google/gemma-4-E4B-it"
# card_context: the card's 128K. Active parameters: the card's "4.5B effective (8B with
# embeddings)"; its per-layer embeddings are a lookup, not read whole per token. Bits per weight:
# the GGUF's 8015415464 bytes over its 7518069290 parameters, 8.53.
card_context = 131072
active_params_b = 4.5
bits_per_weight = 8.53
kind = "generative"
c = 32768
c_reason = """
The audio model; the router loads its Q8_0 mmproj alongside. 4 of its 42 layers hold their own
full-attention cache (the last 18 reuse earlier layers' KV), 16,384 bytes/token, 0.5GiB at
c = 32768; its trained context is 131072.

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose c = 31488 at 16 slots; its result is
recorded in docs/findings/slots.md. The startup set keeps its pre-sweep c = 32768 until the
per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
"""
slots = 4
slots_reason = """
Each slot is one transcription at once. The slots share the model's one KV pool of c tokens
([*]'s kv-unified), so c grows with them.

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 16 slots, its last step; its result is
recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots until the
per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
"""

[models.sampling]
source = "https://huggingface.co/google/gemma-4-E4B-it"
temperature = 1.0
top_p = 0.95
top_k = 64
min_p = 0.0
reason = """
Sampling from the google/gemma-4-E4B-it model card, "1. Sampling Parameters": temperature 1.0,
top_p 0.95, top_k 64. b11529 already applies the GGUF's general.sampling.* keys, which carry the
same three values; the preset states them so the card, not the conversion, is the source, and
sets min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
"""

[models.prompts]
source = "https://huggingface.co/google/gemma-4-E4B-it"
asr = "Transcribe the following speech segment in English into English text."
reason = """
The card's ASR prompt ("6. Audio"), the language filled in, without its formatting bullets
("Only output the transcription, with no newlines"; "When transcribing numbers, write the
digits"). On a clip of a word or two, gemma-4-E4B reads the bullets back as the transcript: on
AMI's 40 shortest tier clips the full prompt scored 165% WER and the sentence alone 47%, and on
40 LibriSpeech test.other utterances both scored 6.3%. The normalizer writes numbers as digits
whichever way they come, so the bullets don't bear on the score. Fitness, capacity, the set
stage and the quality stage's ASR task all send it, so every stage that times or scores a
transcription asks for one the same way.
"""

[[models]]
id = "ggml-org/embeddinggemma-2-GGUF:Q8_0"
publisher = "Google"
origin = "United States"
# Licence: the card's license metadata (apache-2.0), at
# https://huggingface.co/google/embeddinggemma-2.
licence = "Apache-2.0"
roles = ["embedding"]
card_url = "https://huggingface.co/google/embeddinggemma-2"
# card_context: the card's context window. Active parameters: the served GGUF's 271002648 (the
# router's /v1/models meta), dense; the card's 740M total counts the image and audio encoders
# no-mmproj keeps out. Bits per weight: its 294064224 bytes over those parameters, 8.68.
card_context = 8192
active_params_b = 0.271
bits_per_weight = 8.68
kind = "embedding"
# dims: the 768-dimension output its card states.
dims = 768
c = 8192
c_reason = """
Text embeddings only, 768-dimension output. c = 8192 is the context window its card states (the
GGUF's context_length key reads 262144). No sampling: an embedding model doesn't sample.

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose to hold c = 8192 and sweep the slots
alone; its result is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep
c = 8192 until the per-session target for real agent sessions is settled (the goal record's
redirect, 2026-10-21).
"""
slots = 4
slots_reason = """
Each slot is one input embedded at once. llama.cpp keeps no KV memory for an embedding model
(src/llama-model.cpp, create_memory), so the slots share no pool and c bounds each input alone.

Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 16 slots, its last step; its result is
recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots until the
per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
"""
args_reason = """
embeddings serves it as an embedding model. Mean pooling, per its model card and its GGUF's
pooling_type. The repository also ships an mmproj (its image and audio encoders), which
no-mmproj keeps out. b and ub match c, since an embedding input has to fit in one physical
batch.
"""

[models.args]
embeddings = true
pooling = "mean"
no-mmproj = true
b = 8192
ub = 8192

# The prompts' keys are MTEB's prompt names; MTEB picks one by its order
# (mteb.models.abs_encoder.get_prompt_name): task-prompt type, task, type-prompt type, type,
# prompt type.
[models.prompts]
source = "https://huggingface.co/google/embeddinggemma-2"
reason = """
EmbeddingGemma 2's prompts: the "prompts" of its sentence-transformers configuration
(config_sentence_transformers.json in the model's repository), the card's "Task Instruction
Prefixes" table as prompt names. Kept are the keys MTEB resolves (task types, prompt types, and
type-prompt compounds), verbatim; the card's own names (SearchQuery, Document, FactChecking,
...) are sentence-transformers' prompt_name values, which MTEB never looks up. The document
prompt's "title: none" takes a corpus item's own title where it has one, the card's document
form.
"""

[models.prompts.embedding]
BitextMining = "task: search result | query: "
Classification = "task: classification | query: "
Clustering = "task: clustering | query: "
InstructionRetrieval = "task: code retrieval | query: "
MultilabelClassification = "task: classification | query: "
PairClassification = "task: sentence similarity | query: "
Reranking = "task: search result | query: "
Retrieval = "task: search result | query: "
Retrieval-document = "title: none | text: "
Retrieval-query = "task: search result | query: "
STS = "task: sentence similarity | query: "
Summarization = "task: sentence similarity | query: "
document = "title: none | text: "
query = "task: search result | query: "
