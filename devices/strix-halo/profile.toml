# The Strix Halo profile: three sets of models, each loaded side by side and sized together
# against the 96GiB GTT pool of a ~90-96GB unified-memory host. Set A, the startup set, is four
# models; its settings are personal-agents' 96GiB preset (profiles/unified-96gb.ini) and the
# recipes it copies (reference/model-tiers.md, "~90-96GB (unified memory)"). The mistral and
# nemotron sets were the main-model candidates, each a vision MoE that takes set A's chat and
# image roles beside set A's gemma-4-E4B and EmbeddingGemma 2, loaded only when swapped in over
# the router's API (hosting/cmd/swap). The mistral set stays only as the disqualified entry:
# Mistral Small 4 failed main-model's fitness (speed, on b11669), and its files are deleted from
# the host, so a load would download them again (~35 min). Each model's reasons say why it takes
# its values.
#
# Each model runs its official embedded chat template at its card's sampling. Set A's models
# set no reasoning effort (the template's default); a candidate sets the one its card
# recommends, or the template's default where that is the card's. A shape a client must get,
# such as a mandatory tool call, is the client's to constrain per request (tool_choice,
# response_format), not the profile's.
host_class = "strix-halo"
bind = "tailnet"
# One KV pool for each model, its slots sharing it; each model sets its own slots.
kv = "unified"
# Strix Halo's memory bandwidth: 256-bit LPDDR5X-8000, 256 GB/s. evaluate compares each decode
# speed with the ceiling it sets (bandwidth over the bytes a token reads); nothing gates on it.
memory_bandwidth_gb_s = 256

# min_build is a floor, not a pin: a host runs any build at or above it, and each measurement
# names the build it ran on (memory_budget.build, and /props build_info). b11452 is the first
# build that runs EmbeddingGemma 2, the newest of set A's models, so it is the oldest build set A
# can serve on. The nemotron set needs b11669 or later (Nemotron 3.5 Super's support, the
# goal record's main-model brief); the floor stays set A's, since set A is the startup set and
# the host loads the nemotron set only after its move to b11669.
[engine]
name = "llama.cpp"
backend = "vulkan"
min_build = "b11452"

# c = 32768 is the default for a model without its own section, one pulled ad hoc; every set-A
# model sets its own c. checkpoint_min_step = 4096, down from llama.cpp's 8192, makes the
# 32-checkpoint budget's reach (32 x 4096 = 131072) match gpt-oss-120b's c exactly, while a
# stable prefix shorter than 8192 tokens still gets a checkpoint past it.
[defaults]
c = 32768
gpu_layers = 999
checkpoint_min_step = 4096

# Set A loads when the router starts: the harness model, a vision model, an audio model and
# the embedding model, four, the router's default --models-max.
[[sets]]
name = "a"
startup = true
models = [
  "ggml-org/gpt-oss-120b-GGUF:MXFP4",
  "ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0",
  "ggml-org/gemma-4-E4B-it-GGUF:Q8_0",
  "ggml-org/embeddinggemma-2-GGUF:Q8_0",
]

# The model each role's requests go to, for the probe and every instrument. Roles alone can't
# pick them: three of set A's models declare chat and two declare vision. gpt-oss-120b is the
# harness model, Gemma 4 26B-A4B takes the images and gemma-4-E4B the audio.
[sets.roles]
chat = "ggml-org/gpt-oss-120b-GGUF:MXFP4"
vision = "ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0"
audio = "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"
embedding = "ggml-org/embeddinggemma-2-GGUF:Q8_0"

# The binding test: with all four loaded and four requests in flight on each, at least the pool
# floor, 2816MiB (2.75GiB, evaluation/floors.toml), stays free.
[sets.memory_budget]
pool_mib = 98304
measured_mib = 94926
build = "b11565"
source = "docs/findings/memory-budget.md"

# The Mistral Small 4 candidate: Mistral Small 4 takes chat and images, gemma-4-E4B the audio,
# EmbeddingGemma 2 the embeddings. Three models; it loads without load-on-startup, by swap.
[[sets]]
name = "mistral"
models = [
  "unsloth/Mistral-Small-4-119B-2603-GGUF:Q4_K_XL",
  "ggml-org/gemma-4-E4B-it-GGUF:Q8_0",
  "ggml-org/embeddinggemma-2-GGUF:Q8_0",
]

[sets.roles]
chat = "unsloth/Mistral-Small-4-119B-2603-GGUF:Q4_K_XL"
vision = "unsloth/Mistral-Small-4-119B-2603-GGUF:Q4_K_XL"
audio = "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"
embedding = "ggml-org/embeddinggemma-2-GGUF:Q8_0"

# Estimated, never measured at 4 in flight: Mistral Small 4 was disqualified at fitness (speed) on
# b11669 before the concurrent run, so measured_mib stays unset; idle on b11669 the set used
# 87763MiB of the pool (docs/findings/memory-budget.md). By that note's figures, 83154MiB of the
# pool is left for a main model beside gemma-4-E4B and EmbeddingGemma 2 at main-model's 3GiB
# floor, so the pool holds 98304 - 3072 - 83154 = 12078MiB for those two and the desktop. Mistral
# Small 4 is ~71526MiB of UD-Q4_K_XL weights and its mmproj, plus 2.8-5.1GiB of KV at c = 131072,
# taken at the top (5222MiB): 76748MiB, compute buffers not counted. 12078 + 76748 = 88826MiB,
# 9478MiB under the pool.
[sets.memory_budget]
pool_mib = 98304
estimated_mib = 88826
source = "docs/findings/memory-budget.md"

# The Nemotron 3.5 Super candidate: Nemotron 3.5 Super VL takes chat and images, gemma-4-E4B the
# audio, EmbeddingGemma 2 the embeddings. Three models; it loads without load-on-startup, by
# swap.
[[sets]]
name = "nemotron"
models = [
  "ggml-org/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-GGUF:NVFP4",
  "ggml-org/gemma-4-E4B-it-GGUF:Q8_0",
  "ggml-org/embeddinggemma-2-GGUF:Q8_0",
]

[sets.roles]
chat = "ggml-org/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-GGUF:NVFP4"
vision = "ggml-org/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-GGUF:NVFP4"
audio = "ggml-org/gemma-4-E4B-it-GGUF:Q8_0"
embedding = "ggml-org/embeddinggemma-2-GGUF:Q8_0"

# Estimated, not yet measured: measured_mib is the pool used at 4 in flight, which the concurrent
# run measures; idle on b11669 the set used 88598MiB of the pool
# (docs/findings/memory-budget.md). As for the mistral set, 12078MiB of the pool is gemma-4-E4B's,
# EmbeddingGemma 2's and the desktop's.
# Nemotron 3.5 Super is 73355MiB of NVFP4 weights (71.6GiB), 922MiB of Q8_0 mmproj (0.96GB), ~1GiB
# (1024MiB) of KV at c = 131072, and ~660MiB of Mamba state for 4 slots: 75961MiB, compute buffers
# not counted. 12078 + 75961 = 88039MiB, 10265MiB under the pool. Its 8 context checkpoints per slot
# sit in system RAM, outside this pool (the model's args_reason).
[sets.memory_budget]
pool_mib = 98304
estimated_mib = 88039
source = "docs/findings/memory-budget.md"

