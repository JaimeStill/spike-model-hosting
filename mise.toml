[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
jq = "1.8.2"
shellcheck = "0.11.0"

[env]
# The repository's Go modules, as directories; tasks run in each one.
GO_MODULES = "."
# The integration probes read the router to probe from SPIKE_ROUTER_URL, set in the shell that
# runs `mise run integration`; it is never committed, since it names a host.

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module and script; writes nothing"
run = '''
set -eu
export GOWORK=off
shellcheck "$MISE_PROJECT_ROOT"/scripts/*.sh
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
  golangci-lint run --build-tags integration ./...
done
'''

# The integration tier probes a running router over HTTP. It never starts a server on this
# machine: SPIKE_ROUTER_URL names a router on the Framework or the workstation.
[tasks.integration]
description = "Run the integration-tagged HTTP probes against SPIKE_ROUTER_URL"
run = '''
set -eu
export GOWORK=off
: "${SPIKE_ROUTER_URL:?set SPIKE_ROUTER_URL to the router to probe}"
for mod in $GO_MODULES; do
  echo "integration: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go test -race -tags integration -count=1 ./...
done
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, and profile pin behind its latest; writes nothing"
run = "scripts/currency.sh"
