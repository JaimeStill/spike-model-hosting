; llama.cpp router presets for the strix-halo host class, rendered from its profile.
; Engine: llama.cpp (vulkan), build b11452 or later.

[*]
jinja = true
n-gpu-layers = 999
c = 32768
metrics = true
checkpoint-min-step = 4096
parallel = 4
kv-unified = true

; OpenAI (United States). Card: https://huggingface.co/openai/gpt-oss-120b
; Licence: Apache-2.0. Roles: chat.
; Sampling: https://github.com/openai/gpt-oss
;
; The harness model. c = 131072 is its trained context_length, the ceiling: its KV cache costs
; 36,864 bytes/token (18 of 36 layers hold a full-attention cache; the rest are 128-token sliding
; windows), 4.5GiB at this c, beside ~59GiB of MXFP4 weights.
;
; Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters": temperature 1.0, top_p
; 1.0; top-k = 0 and min-p = 0 turn off the truncations the card doesn't name.
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
load-on-startup = true
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 131072
temp = 1
top-p = 1
top-k = 0
min-p = 0

; Google (United States). Card: https://huggingface.co/google/embeddinggemma-2
; Licence: Apache-2.0. Roles: embedding.
;
; Text embeddings only, 768-dimension output. c = 8192 is the context window its card states.
;
; embeddings serves it as an embedding model, mean pooling per its card; b and ub match c.
[ggml-org/embeddinggemma-2-GGUF:Q8_0]
load-on-startup = true
hf-repo = ggml-org/embeddinggemma-2-GGUF:Q8_0
c = 8192
b = 8192
embeddings = true
pooling = mean
ub = 8192
