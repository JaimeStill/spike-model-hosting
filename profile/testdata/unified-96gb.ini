; Model preset for the llama.cpp router, applied via `outpost preset install
; unified-96gb` (see ../admin/bin/). Keyed by hardware capability tier, not by
; host — any host in the ~90-96GB unified-memory tier uses this file. Applied
; today on the Framework desktop (see ../preparation/framework-desktop.md).
;
; Full specification: ../reference/config-presets.md
; Which models need what, and why: ../reference/model-tiers.md
;
; Sections here are copies of recipes from ../reference/model-tiers.md, "~90-96GB
; (unified memory)", not authored fresh — each one notes which recipe it came
; from, so a change to the recipe has an obvious place to re-propagate to.
;
; Set A: four models loaded side by side, sized together against the 96GiB
; GTT pool. The binding test is measured, not estimated: with all four loaded
; and four requests in flight on each, `outpost amd usage` shows at least
; 3GiB of the pool free (../reference/model-selection.md, "Usable memory, not
; raw memory").
;
; Each model runs its official embedded chat template (no chat-template
; override) at its model card's sampling, with no reasoning effort set (the
; template's default). A shape a client must get, such as a mandatory tool
; call, is the client's to constrain per request (tool_choice,
; response_format), not the preset's (../reference/model-tiers.md, "~90-96GB
; (unified memory)").

[*]
jinja = true
n-gpu-layers = 999
c = 32768
metrics = true
checkpoint-min-step = 4096
parallel = 4
kv-unified = true

; c = 32768 is the default for a model without its own section (one pulled
; ad hoc through pi's Download model... flow); every set-A model below sets
; its own c.
;
; parallel = 4 and kv-unified = true pin what -np's auto default already
; picked on this host (4 slots, one shared KV pool sized to c total, not
; c x slots — see ../reference/memory-footprint.md). Setting parallel
; explicitly turns kv-unified's auto default off, so the two are set
; together.
;
; checkpoint-min-step = 4096, tuned down from the 8192 default
; (tuning.checkpoint-tuning). Live comparison: at the default, a checkpoint
; only ever lands at the trivial system-prompt boundary for a stable prefix
; shorter than 8192 tokens, so an edit past a short preamble gets no reuse
; at all (measured: 12/3870 tokens cached, ~6.1s). 4096 was chosen over an
; equally effective 1024 for the coverage math: the 32-checkpoint budget's
; reach is 32 x checkpoint-min-step, and 4096 matches that reach (131072)
; exactly to gpt-oss-120b's configured c — the largest in this file, and
; the model pi sessions run on — versus 1024's 32768-token reach, a quarter
; of it, risking early-checkpoint eviction in long sessions. Confirmed live
; at both 1024 and 4096: once the stable prefix clears the spacing, reuse is
; near-total (measured: 5122/5170 tokens cached at 4096, ~350ms — a ~17.7x
; drop in prompt processing time). See
; ../research/framework-desktop-followups.md.

; --cache-reuse deliberately left unset: tested (tuning.cache-reuse-tuning)
; and confirmed dead in llama-cpp 0.4.0-1 (b10809) — the flag parses but
; tools/server has no chunk-reuse implementation left, source-verified
; against the exact running commit. See
; ../research/framework-desktop-followups.md, "Caching and persistence
; flags."

; Recipe: ../reference/model-tiers.md, ~90-96GB tier, gpt-oss-120b. The
; harness model (pi). c = 131072 is its trained context_length, the
; ceiling: its KV cache costs 36,864 bytes/token (18 of 36 layers hold a
; full-attention cache; the rest are 128-token sliding windows), 4.5GiB at
; this c, beside ~59GiB of MXFP4 weights.
;
; Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters":
; temperature 1.0, top_p 1.0 (https://github.com/openai/gpt-oss). This
; GGUF carries no general.sampling.* keys, so without these lines b11529
; serves its own defaults (temp 0.8, top-k 40, top-p 0.95, min-p 0.05 in
; /props default_generation_settings). top-k = 0 and min-p = 0 turn off
; the two truncations the card doesn't name.
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
c = 131072
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0

; Recipe: ../reference/model-tiers.md, ~90-96GB tier, Gemma 4 26B-A4B. The
; vision model; the router loads its Q8_0 mmproj alongside. 5 of its 30
; layers hold a full-attention cache (20,480 bytes/token, 0.625GiB at this
; c); the rest are 1024-token sliding windows. The shared budget binds here,
; not its trained 262144: at c = 65536, all four loaded with four requests in
; flight on each left 2.61GiB of the pool free, under the 3GiB bar, so this
; c — the first to drop — is 32768.
;
; Sampling from the google/gemma-4-26B-A4B-it model card, "1. Sampling
; Parameters": temperature 1.0, top_p 0.95, top_k 64
; (https://huggingface.co/google/gemma-4-26B-A4B-it). b11529 already applies
; the GGUF's general.sampling.* keys, which carry the same three values; the
; preset states them so the card, not the conversion, is the source, and sets
; min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
[ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0]
c = 32768
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0

; Recipe: ../reference/model-tiers.md, ~90-96GB tier, gemma-4-E4B. The
; audio model; the router loads its Q8_0 mmproj alongside. 4 of its 42
; layers hold their own full-attention cache (the last 18 reuse earlier
; layers' KV), 16,384 bytes/token, 0.5GiB at this c; c = 32768 is a quarter
; of its trained 131072.
;
; Sampling from the google/gemma-4-E4B-it model card, "1. Sampling
; Parameters": temperature 1.0, top_p 0.95, top_k 64
; (https://huggingface.co/google/gemma-4-E4B-it). b11529 already applies the
; GGUF's general.sampling.* keys, which carry the same three values; the
; preset states them so the card, not the conversion, is the source, and sets
; min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
[ggml-org/gemma-4-E4B-it-GGUF:Q8_0]
c = 32768
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0

; Recipe: ../reference/model-tiers.md, ~90-96GB tier, EmbeddingGemma 2. Text
; embeddings only: the repository also ships an mmproj (its image and audio
; encoders), which no-mmproj keeps out. Mean pooling, per its model card and
; its GGUF's pooling_type; 768-dimension output. c = 8192 is the context
; window its card states (the GGUF's context_length key reads 262144). b and
; ub match c, since an embedding input has to fit in one physical batch. No
; sampling keys: an embedding model doesn't sample.
[ggml-org/embeddinggemma-2-GGUF:Q8_0]
embeddings = true
pooling = mean
no-mmproj = true
c = 8192
b = 8192
ub = 8192
