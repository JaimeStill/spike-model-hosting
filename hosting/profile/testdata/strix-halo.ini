; llama.cpp router presets for the strix-halo host class, rendered from its profile.
; Engine: llama.cpp (vulkan), build b11452 or later.

[*]
jinja = true
n-gpu-layers = 999
c = 32768
metrics = true
checkpoint-min-step = 4096
kv-unified = true

; OpenAI (United States). Card: https://huggingface.co/openai/gpt-oss-120b
; Licence: Apache-2.0. Roles: chat.
; Sampling: https://github.com/openai/gpt-oss
;
; The harness model. Its trained context_length, 131072, is the ceiling c may reach: its KV cache
; costs 36,864 bytes/token (18 of 36 layers hold a full-attention cache; the rest are 128-token
; sliding windows), 4.5GiB at c = 131072, beside ~59GiB of MXFP4 weights.
;
; Swept: c = 17664 is 2 sessions of the agent role's per-session target, 8806 tokens
; (evaluation/targets.toml), rounded up to a multiple of 256: the context evaluate sweep's step at 2
; ran, on b11734-f3fb2fcdb, 2026-10-20.
;
; Each slot is one agent session at once. The slots share the model's one KV pool of c tokens ([*]'s
; kv-unified), so c grows with them.
;
; Swept: 2 slots, chosen by evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, in set a beside the
; settings chosen before it: the smaller of the largest N that held every floor at N, the pool floor
; and every session's context (4) and the knee at 2. Bound by knee: past it total throughput gains
; under 10% a step (the knee). The sweep's table is in docs/findings/slots.md.
;
; Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters": temperature 1.0, top_p
; 1.0. This GGUF carries no general.sampling.* keys, so without these the server serves its own
; defaults (temp 0.8, top-k 40, top-p 0.95, min-p 0.05 on b11529). top-k = 0 and min-p = 0 turn off
; the two truncations the card doesn't name.
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
load-on-startup = true
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 17664
parallel = 2
temp = 1
top-p = 1
top-k = 0
min-p = 0

; Google (United States). Card: https://huggingface.co/google/gemma-4-26B-A4B-it
; Licence: Apache-2.0. Roles: chat, vision.
; Sampling: https://huggingface.co/google/gemma-4-26B-A4B-it
;
; The vision model; the router loads its Q8_0 mmproj alongside. 5 of its 30 layers hold a
; full-attention cache (20,480 bytes/token, 0.625GiB at c = 32768); the rest are 1024-token sliding
; windows. The shared budget binds here, not its trained 262144: at c = 65536 and 4 slots, all four
; loaded with four requests in flight on each left 2.61GiB of the pool free, under the 2.75GiB pool
; floor (docs/findings/memory-budget.md).
;
; Swept: c = 41472 is 8 sessions of the vision role's per-session target, 5172 tokens
; (evaluation/targets.toml), rounded up to a multiple of 256: the context evaluate sweep's step at 8
; ran, on b11734-f3fb2fcdb, 2026-10-20.
;
; Each slot is one image request at once. The slots share the model's one KV pool of c tokens ([*]'s
; kv-unified), so c grows with them.
;
; Swept: 8 slots, chosen by evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, in set a beside the
; settings chosen before it: the smaller of the largest N that held every floor at N, the pool floor
; and every session's context (8) and no knee. Bound by floor: the next step failed a floor at N.
; The sweep's table is in docs/findings/slots.md.
;
; mtmd-batch-max-tokens = 512 encodes each image in a batch of its own: the server caps an image at
; 512 tokens (its ubatch), and by default batches consecutive images of the same patch grid up to
; 1024. The image encoder's compute buffer, reserved at load for a 256-token warm-up image, grows to
; the largest batch it has run and never shrinks: one 512-token image adds ~200MiB, a two-image
; batch ~330MiB more. The cap takes the two-image step off, so the model's worst case stays at the
; single-image level, at a measured cost within 1% on a two-image prompt's prefill
; (docs/findings/memory-budget.md, "Gemma 4 26B-A4B's growth under vision use").
;
; Sampling from the google/gemma-4-26B-A4B-it model card, "1. Sampling Parameters": temperature 1.0,
; top_p 0.95, top_k 64. b11529 already applies the GGUF's general.sampling.* keys, which carry the
; same three values; the preset states them so the card, not the conversion, is the source, and sets
; min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
[ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0]
load-on-startup = true
hf-repo = ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0
c = 41472
parallel = 8
mtmd-batch-max-tokens = 512
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Google (United States). Card: https://huggingface.co/google/gemma-4-E4B-it
; Licence: Apache-2.0. Roles: chat, vision, audio.
; Sampling: https://huggingface.co/google/gemma-4-E4B-it
;
; The audio model; the router loads its Q8_0 mmproj alongside. 4 of its 42 layers hold their own
; full-attention cache (the last 18 reuse earlier layers' KV), 16,384 bytes/token, 0.5GiB at c =
; 32768; its trained context is 131072.
;
; Swept: c = 31488 is 16 sessions of the audio role's per-session target, 1956 tokens
; (evaluation/targets.toml), rounded up to a multiple of 256: the context evaluate sweep's step at
; 16 ran, on b11734-f3fb2fcdb, 2026-10-20.
;
; Each slot is one transcription at once. The slots share the model's one KV pool of c tokens ([*]'s
; kv-unified), so c grows with them.
;
; Swept: 16 slots, chosen by evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, in set a beside the
; settings chosen before it: the smaller of the largest N that held every floor at N, the pool floor
; and every session's context (16) and no knee. Bound by top: it is the sweep's last step. The
; sweep's table is in docs/findings/slots.md.
;
; Sampling from the google/gemma-4-E4B-it model card, "1. Sampling Parameters": temperature 1.0,
; top_p 0.95, top_k 64. b11529 already applies the GGUF's general.sampling.* keys, which carry the
; same three values; the preset states them so the card, not the conversion, is the source, and sets
; min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
[ggml-org/gemma-4-E4B-it-GGUF:Q8_0]
load-on-startup = true
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q8_0
c = 31488
parallel = 16
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Google (United States). Card: https://huggingface.co/google/embeddinggemma-2
; Licence: Apache-2.0. Roles: embedding.
;
; Text embeddings only, 768-dimension output. c = 8192 is the context window its card states (the
; GGUF's context_length key reads 262144). No sampling: an embedding model doesn't sample.
;
; Swept: c = 8192 held at its committed value by evaluate sweep on b11734-f3fb2fcdb, 2026-10-20,
; which swept the slots alone: llama.cpp keeps no KV memory for an embedding model, so c bounds each
; input, 8192 tokens at the embedding role's target (evaluation/targets.toml).
;
; Each slot is one input embedded at once. llama.cpp keeps no KV memory for an embedding model
; (src/llama-model.cpp, create_memory), so the slots share no pool and c bounds each input alone.
;
; Swept: 16 slots, chosen by evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, in set a beside the
; settings chosen before it: the smaller of the largest N that held every floor at N, the pool floor
; and every session's context (16) and no knee. Bound by top: it is the sweep's last step. The
; sweep's table is in docs/findings/slots.md.
;
; embeddings serves it as an embedding model. Mean pooling, per its model card and its GGUF's
; pooling_type. The repository also ships an mmproj (its image and audio encoders), which no-mmproj
; keeps out. b and ub match c, since an embedding input has to fit in one physical batch.
[ggml-org/embeddinggemma-2-GGUF:Q8_0]
load-on-startup = true
hf-repo = ggml-org/embeddinggemma-2-GGUF:Q8_0
c = 8192
parallel = 16
b = 8192
embeddings = true
no-mmproj = true
pooling = mean
ub = 8192

; Mistral AI (France). Card: https://huggingface.co/mistralai/Mistral-Small-4-119B-2603
; Licence: Apache-2.0. Roles: chat, vision.
; Sampling: https://huggingface.co/mistralai/Mistral-Small-4-119B-2603
;
; The Mistral Small 4 candidate's main model, unsloth's UD-Q4_K_XL (no ggml-org or mistralai GGUF
; exists); the router loads its mmproj alongside. Its card states a 256k (262144) context; c =
; 131072 is gpt-oss-120b's, so the candidates compare at set A's main-model context, and 262144
; would leave the pool under main-model's 3GiB floor. Its KV at this c is estimated at 2.8-5.1GiB.
;
; 4 slots, the evaluation baseline's value, set A's: the candidates are judged at the requests in
; flight set A's models were, until screen's sweep chooses each model's own.
;
; Sampling from the mistralai/Mistral-Small-4-119B-2603 model card, "Recommended Settings":
; reasoning_effort "high" for complex tasks, at temperature 0.7. Its chat template accepts only
; "none" or "high" (it raises on any other), so reasoning = "high" renders as the template's
; reasoning_effort. The card names no top_p, top_k or min_p, so top-p = 1.0, top-k = 0 and min-p = 0
; turn off the truncations it doesn't name, as align decided for every model.
[unsloth/Mistral-Small-4-119B-2603-GGUF:Q4_K_XL]
hf-repo = unsloth/Mistral-Small-4-119B-2603-GGUF:Q4_K_XL
c = 131072
parallel = 4
temp = 0.7
top-p = 1
top-k = 0
min-p = 0
chat-template-kwargs = {"reasoning_effort":"high"}

; NVIDIA (United States). Card: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
; Licence: OpenMDW-1.1. Roles: chat, vision.
; Sampling: https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
;
; The Nemotron 3.5 Super candidate's main model, ggml-org's NVFP4, the publisher's evaluated
; precision (its card points to an NVFP4 release for deployment); the router loads its mmproj
; alongside. A Mamba-2 and Transformer hybrid MoE, 120B parameters with 12B active: its card states
; up to 1M tokens of context. c = 131072 is gpt-oss-120b's, so the candidates compare at set A's
; main-model context. Only its attention layers keep a KV cache, ~1GiB at this c; its Mamba layers
; keep a fixed recurrent state per sequence, ~660MiB for 4 slots.
;
; 4 slots, the evaluation baseline's value, set A's: the candidates are judged at the requests in
; flight set A's models were, until screen's sweep chooses each model's own.
;
; Sampling from the nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16 model card, "Model Summary",
; Recommended Sampling: text at temperature 1.0, top_p 0.95; its vision values (0.6, 0.95) are not
; applied, since one preset serves every request. The GGUF carries the same temperature and top_p.
; The card names no top_k or min_p, so top-k = 0 and min-p = 0 turn off those truncations. No
; reasoning is set: the card's Reasoning Mode is the template's enable_thinking, which defaults to
; true, so thinking stays on.
;
; ctx-checkpoints = 8 caps the context checkpoints each slot keeps at 8, down from llama.cpp's 32
; (common/arg.cpp at b11669, --ctx-checkpoints). A hybrid model can't rewind its recurrent state, so
; the server saves checkpoints of it to reuse a prompt's prefix, and keeps them in system RAM
; outside the GPU pool: at the default 32, 4 slots would need ~20.6GiB of it (an estimate); at 8,
; about a quarter of that.
[ggml-org/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-GGUF:NVFP4]
hf-repo = ggml-org/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-GGUF:NVFP4
c = 131072
parallel = 4
temp = 1
top-p = 0.95
top-k = 0
min-p = 0
ctx-checkpoints = 8
