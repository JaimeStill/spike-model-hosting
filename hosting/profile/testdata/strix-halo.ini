; llama.cpp router presets for the strix-halo host class, rendered from its profile.
; Engine: llama.cpp (vulkan), build b11452 or later.

[*]
jinja = true
n-gpu-layers = 999
c = 32768
metrics = true
checkpoint-min-step = 4096
kv-unified = true

; OpenAI (United States). Card: https://huggingface.co/openai/gpt-oss-120b
; Licence: Apache-2.0. Roles: chat.
; Sampling: https://github.com/openai/gpt-oss
;
; The harness model. Its trained context_length, 131072, is the ceiling c may reach: its KV cache
; costs 36,864 bytes/token (18 of 36 layers hold a full-attention cache; the rest are 128-token
; sliding windows), 4.5GiB at c = 131072, beside ~59GiB of MXFP4 weights.
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose c = 17664 at 2 slots; its result is
; recorded in docs/findings/slots.md. The startup set keeps its pre-sweep c = 131072 until the
; per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
;
; Each slot is one agent session at once. The slots share the model's one KV pool of c tokens ([*]'s
; kv-unified), so c grows with them.
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 2 slots, bound by the knee; its
; result is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots until
; the per-session target for real agent sessions is settled (the goal record's redirect,
; 2026-10-21).
;
; Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters": temperature 1.0, top_p
; 1.0. This GGUF carries no general.sampling.* keys, so without these the server serves its own
; defaults (temp 0.8, top-k 40, top-p 0.95, min-p 0.05 on b11529). top-k = 0 and min-p = 0 turn off
; the two truncations the card doesn't name.
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
load-on-startup = true
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 131072
parallel = 4
temp = 1
top-p = 1
top-k = 0
min-p = 0

; Google (United States). Card: https://huggingface.co/google/gemma-4-26B-A4B-it
; Licence: Apache-2.0. Roles: chat, vision.
; Sampling: https://huggingface.co/google/gemma-4-26B-A4B-it
;
; The vision model; the router loads its Q8_0 mmproj alongside. 5 of its 30 layers hold a
; full-attention cache (20,480 bytes/token, 0.625GiB at c = 32768); the rest are 1024-token sliding
; windows. The shared budget binds here, not its trained 262144: at c = 65536 and 4 slots, all four
; loaded with four requests in flight on each left 2.61GiB of the pool free, under the 2.75GiB pool
; floor (docs/findings/memory-budget.md).
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose c = 41472 at 8 slots; its result is
; recorded in docs/findings/slots.md. The startup set keeps its pre-sweep c = 32768 until the
; per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
;
; Each slot is one image request at once. The slots share the model's one KV pool of c tokens ([*]'s
; kv-unified), so c grows with them.
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 8 slots, bound by the image floor;
; its result is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots
; until the per-session target for real agent sessions is settled (the goal record's redirect,
; 2026-10-21).
;
; mtmd-batch-max-tokens = 512 encodes each image in a batch of its own: the server caps an image at
; 512 tokens (its ubatch), and by default batches consecutive images of the same patch grid up to
; 1024. The image encoder's compute buffer, reserved at load for a 256-token warm-up image, grows to
; the largest batch it has run and never shrinks: one 512-token image adds ~200MiB, a two-image
; batch ~330MiB more. The cap takes the two-image step off, so the model's worst case stays at the
; single-image level, at a measured cost within 1% on a two-image prompt's prefill
; (docs/findings/memory-budget.md, "Gemma 4 26B-A4B's growth under vision use").
;
; Sampling from the google/gemma-4-26B-A4B-it model card, "1. Sampling Parameters": temperature 1.0,
; top_p 0.95, top_k 64. b11529 already applies the GGUF's general.sampling.* keys, which carry the
; same three values; the preset states them so the card, not the conversion, is the source, and sets
; min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
[ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0]
load-on-startup = true
hf-repo = ggml-org/gemma-4-26B-A4B-it-GGUF:Q4_0
c = 32768
parallel = 4
mtmd-batch-max-tokens = 512
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Google (United States). Card: https://huggingface.co/google/gemma-4-E4B-it
; Licence: Apache-2.0. Roles: chat, vision, audio.
; Sampling: https://huggingface.co/google/gemma-4-E4B-it
;
; The audio model; the router loads its Q8_0 mmproj alongside. 4 of its 42 layers hold their own
; full-attention cache (the last 18 reuse earlier layers' KV), 16,384 bytes/token, 0.5GiB at c =
; 32768; its trained context is 131072.
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose c = 31488 at 16 slots; its result is
; recorded in docs/findings/slots.md. The startup set keeps its pre-sweep c = 32768 until the
; per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
;
; Each slot is one transcription at once. The slots share the model's one KV pool of c tokens ([*]'s
; kv-unified), so c grows with them.
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 16 slots, its last step; its result
; is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots until the
; per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
;
; Sampling from the google/gemma-4-E4B-it model card, "1. Sampling Parameters": temperature 1.0,
; top_p 0.95, top_k 64. b11529 already applies the GGUF's general.sampling.* keys, which carry the
; same three values; the preset states them so the card, not the conversion, is the source, and sets
; min-p = 0 because the card names no min_p (llama.cpp's default is 0.05).
[ggml-org/gemma-4-E4B-it-GGUF:Q8_0]
load-on-startup = true
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q8_0
c = 32768
parallel = 4
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Google (United States). Card: https://huggingface.co/google/embeddinggemma-2
; Licence: Apache-2.0. Roles: embedding.
;
; Text embeddings only, 768-dimension output. c = 8192 is the context window its card states (the
; GGUF's context_length key reads 262144). No sampling: an embedding model doesn't sample.
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose to hold c = 8192 and sweep the slots
; alone; its result is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep c =
; 8192 until the per-session target for real agent sessions is settled (the goal record's redirect,
; 2026-10-21).
;
; Each slot is one input embedded at once. llama.cpp keeps no KV memory for an embedding model
; (src/llama-model.cpp, create_memory), so the slots share no pool and c bounds each input alone.
;
; Swept: evaluate sweep on b11734-f3fb2fcdb, 2026-10-20, chose 16 slots, its last step; its result
; is recorded in docs/findings/slots.md. The startup set keeps its pre-sweep 4 slots until the
; per-session target for real agent sessions is settled (the goal record's redirect, 2026-10-21).
;
; embeddings serves it as an embedding model. Mean pooling, per its model card and its GGUF's
; pooling_type. The repository also ships an mmproj (its image and audio encoders), which no-mmproj
; keeps out. b and ub match c, since an embedding input has to fit in one physical batch.
[ggml-org/embeddinggemma-2-GGUF:Q8_0]
load-on-startup = true
hf-repo = ggml-org/embeddinggemma-2-GGUF:Q8_0
c = 8192
parallel = 4
b = 8192
embeddings = true
no-mmproj = true
pooling = mean
ub = 8192
