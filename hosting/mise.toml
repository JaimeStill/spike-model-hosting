# The hosting area: the profile schema and its renders, the router client, the set swap, and the
# HTTP probe. The root's check covers its packages, module-wide.

# The probe reads a running router over HTTP, the router SPIKE_ROUTER_URL names; it never starts
# a server on this machine. The root's integration task runs this one.
[tasks.integration]
description = "Run the integration-tagged HTTP probes against SPIKE_ROUTER_URL"
run = '''
set -eu
export GOWORK=off
: "${SPIKE_ROUTER_URL:?set SPIKE_ROUTER_URL to the router to probe}"
go test -race -tags integration -count=1 ./...
'''
